name: Build and Push Mapping Image (ARM64)

# Push only: a pull_request trigger would build every PR commit a second time, without pushing.
# The branch build already shows as the PR's check.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one. main and tags are
# never cancelled: each of their runs publishes an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/skymule-ai/mullet-mapping

    steps:
      # The CUDA base image is ~13.5 GB: not enough disk with the runner's stock toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      # The docker driver builds straight into the runner's Docker, so the smoke test and the push
      # use the image as built: no 13.5 GB export from a separate builder.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      # The build also runs the unit tests (colcon test in the Dockerfile).
      # Cache: the layer cache rides inside the published :main image (inline), so every branch
      # reuses the apt and small_gicp layers and nothing extra is uploaded.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.tags }}
            mullet-mapping-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:main
          cache-to: type=inline

      - name: Smoke test
        run: scripts/smoke.sh
        env:
          MAPPING_IMAGE: mullet-mapping-smoke:${{ github.sha }}

      # Only after the smoke test: the tags this run built, pushed as they are.
      - name: Publish tested image
        run: docker push --all-tags "${IMAGE}"
