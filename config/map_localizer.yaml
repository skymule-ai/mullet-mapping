# map_localizer parameters. Documentation/design.rst explains each one. Tune from replayed bags, never in flight.
/**:
  ros__parameters:
    map_path: /map/map.pcd          # mounted read-only by compose.yaml
    map_frame: map
    odom_frame: camera_init         # FAST-LIO2's world frame (fixed name)
    body_frame: body                # FAST-LIO2's body frame (MID-360 IMU)

    # Map and submap
    map_voxel: 0.2                  # m, map downsampling at load
    submap_window_s: 1.0            # s of scans stacked per match (~10 at 10 Hz)
    submap_voxel: 0.15              # m

    # Loop
    match_rate: 1.0                 # Hz
    tf_rate: 10.0                   # Hz, re-send of the last good map -> camera_init
    sync_queue_size: 10             # scans or odometry held while waiting for their pair

    # Gate
    max_corr_dist: 0.5              # m, a point within this of the map counts as overlap
    min_overlap: 0.5                # fraction of submap points
    max_rmse: 0.2                   # m, over the overlapping points
    max_step_m: 0.3                 # m, change from the previous correction
    max_step_deg: 3.0               # deg
    min_hessian_eig: 0.0            # TODO(step 9): set from a corridor in a replayed bag

    # States
    init_pose: [0.0, 0.0, 0.0, 0.0] # x, y, z (m), yaw (deg) of camera_init in map at start
    init_yaw_steps: 12              # yaw hypotheses in INIT
    lost_after_s: 5.0               # s without a passing match
    max_rejected_steps: 3           # large steps in a row
